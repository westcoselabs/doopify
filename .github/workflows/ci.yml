name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit and service tests
        run: npm run test

      - name: Generate ephemeral build-only data key
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'DATA_ENCRYPTION_KEY=' + require('crypto').randomBytes(48).toString('base64url') + '\n')"

      - name: Build
        env:
          __NEXT_PROCESSED_ENV: "true"
          DATABASE_URL: "postgresql://ci:ci@127.0.0.1:1/build_only"
          JWT_SECRET: "ci-build-only-not-for-deployment"
          EMAIL_PROVIDER: "none"
          SHIPPING_RATE_PROVIDER: "none"
          SHIPPING_LABEL_PROVIDER: "none"
        run: npm run build
